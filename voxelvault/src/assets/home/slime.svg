<svg xmlns="http://www.w3.org/2000/svg" viewBox="-65 -65 130 130" aria-hidden="true"><defs>
<!-- Emerald & Prismatic Glow Filters -->
<filter height="240%" id="emeraldGlowVigorous" width="240%" x="-70%" y="-70%">
<feGaussianBlur result="blur1" stdDeviation="4"></feGaussianBlur>
<feGaussianBlur result="blur2" stdDeviation="10"></feGaussianBlur>
<feMerge>
<feMergeNode in="blur2"></feMergeNode>
<feMergeNode in="blur1"></feMergeNode>
<feMergeNode in="SourceGraphic"></feMergeNode>
</feMerge>
</filter>
<filter height="200%" id="rainbowSoftGlow" width="200%" x="-50%" y="-50%">
<feGaussianBlur result="blur" stdDeviation="4"></feGaussianBlur>
<feMerge>
<feMergeNode in="blur"></feMergeNode>
<feMergeNode in="SourceGraphic"></feMergeNode>
</feMerge>
</filter>
<filter height="180%" id="whiteCoreGlow" width="180%" x="-40%" y="-40%">
<feGaussianBlur result="blur" stdDeviation="2.5"></feGaussianBlur>
<feMerge>
<feMergeNode in="blur"></feMergeNode>
<feMergeNode in="SourceGraphic"></feMergeNode>
</feMerge>
</filter>
<!-- Slime Jelly Cube Gradient -->
<linearGradient id="slimeCubeGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#a7f3d0"></stop>
<stop offset="35%" stop-color="#34d399"></stop>
<stop offset="85%" stop-color="#10b981"></stop>
<stop offset="100%" stop-color="#047857"></stop>
</linearGradient>
<!-- Floor Dynamic Shadow Gradient -->
<radialGradient cx="50%" cy="50%" id="floorShadowGradSlime" r="50%">
<stop offset="0%" stop-color="#10b981" stop-opacity="0.6"></stop>
<stop offset="50%" stop-color="#047857" stop-opacity="0.25"></stop>
<stop offset="100%" stop-color="#0e0e10" stop-opacity="0"></stop>
</radialGradient>
<!-- Rainbow Arc Linear Gradients -->
<linearGradient id="rainbowGradBand1" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#34d399"></stop>
<stop offset="25%" stop-color="#38bdf8"></stop>
<stop offset="50%" stop-color="#818cf8"></stop>
<stop offset="75%" stop-color="#c084fc"></stop>
<stop offset="100%" stop-color="#f472b6"></stop>
</linearGradient>
<linearGradient id="rainbowGradBand2" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#10b981"></stop>
<stop offset="25%" stop-color="#06b6d4"></stop>
<stop offset="50%" stop-color="#6366f1"></stop>
<stop offset="75%" stop-color="#a855f7"></stop>
<stop offset="100%" stop-color="#ec4899"></stop>
</linearGradient>
<linearGradient id="rainbowGradBand3" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#059669"></stop>
<stop offset="25%" stop-color="#0284c7"></stop>
<stop offset="50%" stop-color="#4f46e5"></stop>
<stop offset="75%" stop-color="#9333ea"></stop>
<stop offset="100%" stop-color="#db2777"></stop>
</linearGradient>
<linearGradient id="rainbowGradBand4" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#047857"></stop>
<stop offset="25%" stop-color="#0369a1"></stop>
<stop offset="50%" stop-color="#4338ca"></stop>
<stop offset="75%" stop-color="#7e22ce"></stop>
<stop offset="100%" stop-color="#be185d"></stop>
</linearGradient>
</defs><style>


  .vv-feature-grid-svg {
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
    user-select: none;
    overflow: visible;
  }

  .col-area {
    pointer-events: auto;
  }

  .feature-title {
    fill: #f4f4f5;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-anchor: middle;
  }

  .feature-desc {
    fill: #a1a1aa;
    font-size: 14.5px;
    font-weight: 400;
    line-height: 1.55;
    letter-spacing: 0.005em;
    text-anchor: middle;
  }

  .col-divider {
    stroke: #27272a;
    stroke-width: 1;
    opacity: 0.85;
  }

  /* ICON 1: COMPASS */
  .compass-outer-bezel {
    stroke: #34d399;
    stroke-width: 2.4;
    fill: rgba(16, 185, 129, 0.08);
  }

  .compass-inner-track {
    stroke: #10b981;
    stroke-width: 1.4;
    stroke-dasharray: 3 3;
    opacity: 0.8;
    animation: trackRotateRapid 7s linear infinite;
    transform-origin: 0px 0px;
  }

  @keyframes trackRotateRapid {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .compass-needle-group {
    transform-origin: 0px 0px;
    animation: compassFierceQuest 2.8s cubic-bezier(0.2, 0.8, 0.25, 1) infinite;
  }

  @keyframes compassFierceQuest {
    0% { transform: rotate(0deg) scale(1); }
    8% { transform: rotate(45deg) scale(1.05); }
    15% { transform: rotate(-30deg) scale(1.02); }
    26% { transform: rotate(290deg) scale(1.18); }
    34% { transform: rotate(260deg) scale(1.08); }
    42% { transform: rotate(315deg) scale(1.12); }
    54% { transform: rotate(120deg) scale(1.2); }
    64% { transform: rotate(95deg) scale(1.04); }
    76% { transform: rotate(440deg) scale(1.22); }
    86% { transform: rotate(390deg) scale(1.06); }
    94% { transform: rotate(352deg) scale(0.98); }
    100% { transform: rotate(360deg) scale(1); }
  }

  /* ICON 2: RAINBOW (Centered at X = 728, Y = 64) */
  .rainbow-master-container {
    transform-origin: 0px 8px;
    animation: rainbowFloatWave 3.5s ease-in-out infinite;
  }

  @keyframes rainbowFloatWave {
    0%, 100% { transform: translateY(0px) scale(1); }
    50% { transform: translateY(-4px) scale(1.03); }
  }

  .rainbow-band {
    fill: none;
    stroke-linecap: round;
  }

  .rainbow-band-1 {
    stroke: url(#rainbowGradBand1);
    stroke-width: 3.8;
    stroke-dasharray: 120;
    stroke-dashoffset: 0;
    animation: rainbowShimmer1 3.2s linear infinite;
  }
  .rainbow-band-2 {
    stroke: url(#rainbowGradBand2);
    stroke-width: 3.8;
    stroke-dasharray: 100;
    stroke-dashoffset: 0;
    animation: rainbowShimmer2 3.2s linear infinite 0.3s;
  }
  .rainbow-band-3 {
    stroke: url(#rainbowGradBand3);
    stroke-width: 3.8;
    stroke-dasharray: 80;
    stroke-dashoffset: 0;
    animation: rainbowShimmer3 3.2s linear infinite 0.6s;
  }
  .rainbow-band-4 {
    stroke: url(#rainbowGradBand4);
    stroke-width: 3.4;
    stroke-dasharray: 60;
    stroke-dashoffset: 0;
    animation: rainbowShimmer4 3.2s linear infinite 0.9s;
  }

  @keyframes rainbowShimmer1 {
    0% { stroke-dashoffset: 240; }
    100% { stroke-dashoffset: 0; }
  }
  @keyframes rainbowShimmer2 {
    0% { stroke-dashoffset: 200; }
    100% { stroke-dashoffset: 0; }
  }
  @keyframes rainbowShimmer3 {
    0% { stroke-dashoffset: 160; }
    100% { stroke-dashoffset: 0; }
  }
  @keyframes rainbowShimmer4 {
    0% { stroke-dashoffset: 120; }
    100% { stroke-dashoffset: 0; }
  }

  .rainbow-cloud-base {
    fill: #131b17;
    stroke: #34d399;
    stroke-width: 1.8;
    stroke-linejoin: round;
  }

  .rainbow-sparkle-1, .rainbow-sparkle-2, .rainbow-sparkle-3, .rainbow-sparkle-4 {
    opacity: 0;
    transform-origin: 0px 0px;
  }

  .rainbow-master-container .rainbow-sparkle-1 {
    animation: rainbowSparkleFly 2.6s ease-out infinite;
  }
  .rainbow-master-container .rainbow-sparkle-2 {
    animation: rainbowSparkleFly 2.6s ease-out infinite 0.7s;
  }
  .rainbow-master-container .rainbow-sparkle-3 {
    animation: rainbowSparkleFly 2.6s ease-out infinite 1.4s;
  }
  .rainbow-master-container .rainbow-sparkle-4 {
    animation: rainbowSparkleFly 2.6s ease-out infinite 2.0s;
  }

  @keyframes rainbowSparkleFly {
    0% { transform: translate(0px, 4px) scale(0.2); opacity: 0; }
    30% { opacity: 1; }
    100% { transform: translate(var(--rx, 8px), -36px) scale(1.3) rotate(60deg); opacity: 0; }
  }

  /* ICON 3: SLIME CUBE FAST HOP (1.7s cycle) */
  .slime-cube-hop-carrier {
    transform-origin: 0px 18px;
    animation: slimeCarrierHopCycleFast 1.7s ease-in-out infinite;
  }

  @keyframes slimeCarrierHopCycleFast {
    0% { transform: translate(-22px, 0px) rotate(-2deg); }
    10% { transform: translate(-22px, 0px) rotate(-1deg); }
    30% { transform: translate(0px, -34px) rotate(1deg); }
    50% { transform: translate(22px, 0px) rotate(2deg); }
    60% { transform: translate(22px, 0px) rotate(1deg); }
    80% { transform: translate(0px, -34px) rotate(-1deg); }
    100% { transform: translate(-22px, 0px) rotate(-2deg); }
  }

  .slime-cube-elastic-body {
    transform-origin: 0px 18px;
    animation: slimeSquashCycleFast 1.7s ease-in-out infinite;
  }

  @keyframes slimeSquashCycleFast {
    0% { transform: scale(1.24, 0.78); }
    6% { transform: scale(1.08, 0.94); }
    14% { transform: scale(0.88, 1.18); }
    30% { transform: scale(1.02, 0.98); }
    44% { transform: scale(0.9, 1.15); }
    50% { transform: scale(1.26, 0.76); }
    56% { transform: scale(1.06, 0.95); }
    64% { transform: scale(0.88, 1.18); }
    80% { transform: scale(1.02, 0.98); }
    94% { transform: scale(0.9, 1.15); }
    100% { transform: scale(1.24, 0.78); }
  }

  .slime-cube-shadow-layer {
    animation: slimeShadowSeamlessCycleFast 1.7s ease-in-out infinite;
  }

  @keyframes slimeShadowSeamlessCycleFast {
    0%, 10% { transform: translate(-22px, 22px) scale(1.22, 0.95); opacity: 0.85; }
    30% { transform: translate(0px, 22px) scale(0.5, 0.5); opacity: 0.22; }
    50%, 60% { transform: translate(22px, 22px) scale(1.24, 0.96); opacity: 0.88; }
    80% { transform: translate(0px, 22px) scale(0.5, 0.5); opacity: 0.22; }
    100% { transform: translate(-22px, 22px) scale(1.22, 0.95); opacity: 0.85; }
  }

  .slime-cube-eyes {
    animation: slimeCubeBlink 3.2s ease-in-out infinite;
    transform-origin: 0px 4px;
  }

  @keyframes slimeCubeBlink {
    0%, 46%, 52%, 100% { transform: scaleY(1); }
    49% { transform: scaleY(0.1); }
  }

  .slime-cube-inner-core {
    transform-origin: 0px 0px;
    animation: slimeInnerCoreFloat 1.7s ease-in-out infinite;
  }

  @keyframes slimeInnerCoreFloat {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    30% { transform: translateY(-3px) rotate(3deg); }
    50% { transform: translateY(2px) rotate(-2deg); }
    80% { transform: translateY(-3px) rotate(-3deg); }
  }

  .slime-pop-particle-1, .slime-pop-particle-2 {
    opacity: 0;
  }

  .slime-cube-hop-carrier .slime-pop-particle-1 {
    animation: slimePopBurstFast 1.7s cubic-bezier(0.18, 0.89, 0.32, 1.28) infinite;
  }
  .slime-cube-hop-carrier .slime-pop-particle-2 {
    animation: slimePopBurstFast 1.7s cubic-bezier(0.18, 0.89, 0.32, 1.28) infinite 0.08s;
  }

  @keyframes slimePopBurstFast {
    0%, 48% { transform: translate(0, 0) scale(0.2); opacity: 0; }
    50% { opacity: 1; }
    60%, 97% { transform: translate(14px, -22px) scale(1.1) rotate(45deg); opacity: 0; }
    98% { opacity: 1; }
    100% { transform: translate(-14px, -20px) scale(1.1) rotate(-45deg); opacity: 0; }
  }
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><g>
<g class="slime-cube-shadow-layer">
<ellipse cx="0" cy="0" fill="url(#floorShadowGradSlime)" rx="24" ry="6"></ellipse>
</g>
<g class="slime-cube-hop-carrier">
<g class="slime-pop-particle-1">
<circle cx="0" cy="0" fill="#a7f3d0" filter="url(#whiteCoreGlow)" r="2.2"></circle>
</g>
<g class="slime-pop-particle-2">
<polygon fill="#6ee7b7" points="0,-2.5 2.5,-0.6 0,1.2 -2.5,-0.6"></polygon>
</g>
<g class="slime-cube-elastic-body">
<rect fill="url(#slimeCubeGrad)" filter="url(#emeraldGlowVigorous)" height="36" rx="9" ry="9" stroke="#a7f3d0" stroke-width="1.8" width="36" x="-18" y="-18"></rect>
<path d="M -13 -13 L 2 -13 C 4 -13 6 -11 6 -8 C 6 -9 4 -11 1 -11 L -11 -11 C -12 -11 -13 -10 -13 -8 Z" fill="#ffffff" opacity="0.85"></path>
<circle cx="-11" cy="-6" fill="#ffffff" opacity="0.75" r="1.4"></circle>
<g class="slime-cube-eyes">
<circle cx="-5" cy="0" fill="#042f24" r="2.8"></circle>
<circle cx="-6" cy="-1" fill="#ffffff" r="1.1"></circle>
<circle cx="5" cy="0" fill="#042f24" r="2.8"></circle>
<circle cx="4" cy="-1" fill="#ffffff" r="1.1"></circle>
<ellipse cx="-9.5" cy="4" fill="#f472b6" opacity="0.75" rx="2.2" ry="1.1"></ellipse>
<ellipse cx="9.5" cy="4" fill="#f472b6" opacity="0.75" rx="2.2" ry="1.1"></ellipse>
<path d="M -2 4 Q 0 6 2 4" fill="none" stroke="#042f24" stroke-linecap="round" stroke-width="1.1"></path>
</g>
<g class="slime-cube-inner-core" opacity="0.65" transform="translate(0, 7) scale(0.48)">
<polygon fill="#ffffff" points="0,-7 8,-2 0,3 -8,-2"></polygon>
<polygon fill="#a7f3d0" points="-8,-2 0,3 0,10 -8,5"></polygon>
<polygon fill="#34d399" points="0,3 8,-2 8,5 0,10"></polygon>
</g>
</g>
</g>
</g></svg>