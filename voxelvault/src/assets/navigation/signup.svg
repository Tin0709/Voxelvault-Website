<svg class="sign-up-morph-svg" id="signUpMorphSvg" viewbox="0 0 200 64" xmlns="http://www.w3.org/2000/svg">
<defs>

<lineargradient id="signUpBaseBg" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#18181b"></stop>
<stop offset="100%" stop-color="#111113"></stop>
</lineargradient>
<lineargradient id="signUpActiveBg" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#064e3b"></stop>
<stop offset="50%" stop-color="#065f46"></stop>
<stop offset="100%" stop-color="#047857"></stop>
</lineargradient>

<lineargradient id="signUpBorderGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#6ee7b7"></stop>
<stop offset="50%" stop-color="#10b981"></stop>
<stop offset="100%" stop-color="#059669"></stop>
</lineargradient>

<filter height="160%" id="signUpGlow" width="160%" x="-30%" y="-30%">
<fegaussianblur result="blur" stddeviation="3.2"></fegaussianblur>
<femerge>
<femergenode in="blur"></femergenode>
<femergenode in="SourceGraphic"></femergenode>
</femerge>
</filter>
<radialgradient cx="50%" cy="50%" id="signUpBloom" r="50%">
<stop offset="0%" stop-color="#10b981" stop-opacity="0.45"></stop>
<stop offset="70%" stop-color="#059669" stop-opacity="0.12"></stop>
<stop offset="100%" stop-color="#000000" stop-opacity="0"></stop>
</radialgradient>
</defs>
<style>
    .vv-art-signup .sign-up-morph-svg {
      width: 100%;
      height: 100%;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow: visible;
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    }

    /* Ambient bloom behind button */
    .vv-art-signup .sign-up-glow-aura {
      opacity: 0;
      transform-origin: center;
      transition: opacity 0.5s ease, transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Master capsule:
       Idle: circle 56px wide at center-left x=4.
       Hover / Active: expands into full pill (width: 188px matching Sign Out) with emerald accents!
    */
    .vv-art-signup .sign-up-capsule {
      x: 4px;
      y: 4px;
      width: 56px;
      height: 56px;
      rx: 28px;
      ry: 28px;
      stroke: #27272a;
      stroke-width: 1.2;
      transition: width 0.56s cubic-bezier(0.16, 1, 0.3, 1),
                  stroke 0.4s ease,
                  fill 0.4s ease,
                  filter 0.4s ease;
    }

    .vv-art-signup .sign-up-interior {
      x: 5px;
      y: 5px;
      width: 54px;
      height: 54px;
      rx: 27px;
      ry: 27px;
      opacity: 0;
      transition: width 0.56s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.4s ease;
    }

    /* Outer Bezel Ring centered at (32, 32) */
    .vv-art-signup .sign-up-bezel {
      stroke: #71717a;
      stroke-width: 2.2;
      transform-origin: 32px 32px;
      transition: stroke 0.4s ease, stroke-width 0.4s ease, filter 0.4s ease;
    }

    /* Icon Anchor centered at (32, 32) */
    .vv-art-signup .sign-up-icon-group {
      transform: translate(32px, 32px);
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* User Profile silhouette outline */
    .vv-art-signup .sign-up-user-head {
      fill: none;
      stroke: #a1a1aa;
      stroke-width: 2;
      transition: stroke 0.35s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: -2px -4px;
    }

    .vv-art-signup .sign-up-user-body {
      fill: none;
      stroke: #a1a1aa;
      stroke-width: 2;
      stroke-linecap: round;
      transition: stroke 0.35s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: -2px 5px;
    }

    /* Plus (+) sparkle badge attaching to user icon */
    .vv-art-signup .sign-up-plus-group {
      transform-origin: 7px -6px;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .vv-art-signup .sign-up-plus-stem {
      stroke: #10b981;
      stroke-width: 2.2;
      stroke-linecap: round;
      transition: stroke 0.35s ease, filter 0.35s ease;
    }

    /* Kinetic Sparkle Stars */
    .vv-art-signup .sign-up-sparkle {
      fill: #34d399;
      opacity: 0;
      transform: scale(0.2);
      transform-origin: 7px -6px;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
    }

    /* Text & Dot Reveal */
    .vv-art-signup .sign-up-label-group {
      opacity: 0;
      transform: translateX(-10px);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    /* Perfectly centered text between icon (~60px) and emerald dot (152px) */
    .vv-art-signup .sign-up-text {
      font-size: 15px;
      font-weight: 600;
      fill: #e4e4e7;
      letter-spacing: 0.02em;
      dominant-baseline: central;
      text-anchor: middle;
      transition: fill 0.35s ease;
    }

    /* Glowing Emerald status dot matching Sign Out's dot position */
    .vv-art-signup .sign-up-dot {
      fill: #10b981;
      opacity: 0;
      transform: scale(0.2);
      transform-origin: 152px 32px;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
    }

    /* ==============================================================
       HOVER & EXPANDED STATE
       ============================================================== */
    .vv-art-signup .sign-up-morph-svg:is(:hover,.is-hovered,.is-open,.is-animating) .sign-up-glow-aura,
    .vv-art-signup .sign-up-morph-svg.is-open .sign-up-glow-aura {
      opacity: 0.95;
      transform: scale(1.05);
    }

    .vv-art-signup .sign-up-morph-svg:is(:hover,.is-hovered,.is-open,.is-animating) .sign-up-capsule,
    .vv-art-signup .sign-up-morph-svg.is-open .sign-up-capsule {
      width: 188px;
      stroke: url(#signUpBorderGrad);
      stroke-width: 1.6;
      filter: drop-shadow(0 0 16px rgba(16, 185, 129, 0.35));
    }

    .vv-art-signup .sign-up-morph-svg:is(:hover,.is-hovered,.is-open,.is-animating) .sign-up-interior,
    .vv-art-signup .sign-up-morph-svg.is-open .sign-up-interior {
      width: 186px;
      opacity: 0.35;
    }

    .vv-art-signup .sign-up-morph-svg:is(:hover,.is-hovered,.is-open,.is-animating) .sign-up-bezel,
    .vv-art-signup .sign-up-morph-svg.is-open .sign-up-bezel {
      stroke: #34d399;
      stroke-width: 2.6;
      filter: drop-shadow(0 0 6px rgba(52, 211, 153, 0.65));
    }

    .vv-art-signup .sign-up-morph-svg:is(:hover,.is-hovered,.is-open,.is-animating) .sign-up-user-head,
    .vv-art-signup .sign-up-morph-svg.is-open .sign-up-user-head {
      stroke: #ffffff;
      transform: scale(1.05);
    }

    .vv-art-signup .sign-up-morph-svg:is(:hover,.is-hovered,.is-open,.is-animating) .sign-up-user-body,
    .vv-art-signup .sign-up-morph-svg.is-open .sign-up-user-body {
      stroke: #ffffff;
      transform: scale(1.05);
    }

    /* Kinetic Plus Spin & Glow */
    .vv-art-signup .sign-up-morph-svg:is(:hover,.is-hovered,.is-open,.is-animating) .sign-up-plus-group,
    .vv-art-signup .sign-up-morph-svg.is-open .sign-up-plus-group {
      transform: rotate(90deg) scale(1.15);
    }

    .vv-art-signup .sign-up-morph-svg:is(:hover,.is-hovered,.is-open,.is-animating) .sign-up-plus-stem,
    .vv-art-signup .sign-up-morph-svg.is-open .sign-up-plus-stem {
      stroke: #6ee7b7;
      filter: drop-shadow(0 0 4px rgba(110, 231, 183, 0.9));
    }

    .vv-art-signup .sign-up-morph-svg:is(:hover,.is-hovered,.is-open,.is-animating) .sign-up-sparkle,
    .vv-art-signup .sign-up-morph-svg.is-open .sign-up-sparkle {
      opacity: 1;
      transform: scale(1);
      transition-delay: 0.12s;
    }

    /* Reveal "Sign up" Label */
    .vv-art-signup .sign-up-morph-svg:is(:hover,.is-hovered,.is-open,.is-animating) .sign-up-label-group,
    .vv-art-signup .sign-up-morph-svg.is-open .sign-up-label-group {
      opacity: 1;
      transform: translateX(0px);
      transition-delay: 0.08s;
    }

    .vv-art-signup .sign-up-morph-svg:is(:hover,.is-hovered,.is-open,.is-animating) .sign-up-text,
    .vv-art-signup .sign-up-morph-svg.is-open .sign-up-text {
      fill: #ffffff;
    }

    /* Reveal Emerald Dot with glowing halo */
    .vv-art-signup .sign-up-morph-svg:is(:hover,.is-hovered,.is-open,.is-animating) .sign-up-dot,
    .vv-art-signup .sign-up-morph-svg.is-open .sign-up-dot {
      opacity: 1;
      transform: scale(1);
      transition-delay: 0.16s;
    }

    /* Tactile Press Active State */
    .vv-art-signup .sign-up-morph-svg:active .sign-up-capsule {
      transform: scale(0.98);
      transition: transform 0.08s ease;
    }
  </style>

<g class="sign-up-glow-aura">
<ellipse cx="98" cy="32" fill="url(#signUpBloom)" filter="url(#signUpGlow)" rx="90" ry="22"></ellipse>
</g>

<rect class="sign-up-capsule" fill="url(#signUpBaseBg)"></rect>
<rect class="sign-up-interior" fill="url(#signUpActiveBg)" pointer-events="none"></rect>

<g class="sign-up-icon-group">

<circle class="sign-up-bezel" cx="0" cy="0" fill="none" r="17"></circle>
<circle cx="0" cy="0" fill="#09090b" opacity="0.65" r="13.5"></circle>

<g transform="translate(-2, 0)">

<circle class="sign-up-user-head" cx="0" cy="-4" r="4.2"></circle>

<path class="sign-up-user-body" d="M -7.5 8 C -7.5 4.2 -4 2.2 0 2.2 C 4 2.2 7.5 4.2 7.5 8"></path>
</g>

<g class="sign-up-plus-group">
<line class="sign-up-plus-stem" x1="7" x2="7" y1="-9.5" y2="-2.5"></line>
<line class="sign-up-plus-stem" x1="3.5" x2="10.5" y1="-6" y2="-6"></line>
</g>

<path class="sign-up-sparkle" d="M -11 -7 Q -11 -4 -14 -4 Q -11 -4 -11 -1 Q -11 -4 -8 -4 Q -11 -4 -11 -7 Z"></path>
</g>

<g class="sign-up-label-group">

<text class="sign-up-text" x="105" y="32">Sign up</text>

<circle class="sign-up-dot" cx="152" cy="32" r="3.2"></circle>
<circle class="sign-up-dot" cx="152" cy="32" fill="#10b981" opacity="0.3" r="7"></circle>
</g>


</svg>